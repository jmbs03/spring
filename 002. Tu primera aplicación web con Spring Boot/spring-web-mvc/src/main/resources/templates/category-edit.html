<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edición categoría</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
</head>
<body>

<div class="container text-center mt-5">
    <h2 class="mb-4">Edición de Categoría</h2>
    <form th:action="@{'/categories/'+${category.id}+'/edit'}" method="POST">
        <input type="hidden" th:field="*{category.id}">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre de la categoría</label>
            <input type="text" class="form-control" id="nombre" name="name" placeholder="Ingrese el nombre de la categoría" th:value="*{category.name}" required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <input type="text" class="form-control" id="descripcion" name="description" placeholder="Ingrese la descripción" th:value="*{category.description}" required>
        </div>
        <div class="mb-3">
            <label for="urlimage" class="form-label">Enlace a imagen</label>
            <input type="text" class="form-control" id="urlimage" name="urlImage" placeholder="Ingrese la URL" th:value="*{category.urlImage}">
        </div>
        <div class="mb-3">
            <label for="state" class="form-label">Puede usarse?</label>
            <input type="checkbox" class="form-check-input" id="state" name="state" th:checked="*{category.state}">
        </div>
        <div class="mb-3">
            <label for="fechaCreacion" class="form-label">Fecha de creación</label>
            <input type="text" class="form-control" id="fechaCreacion" name="creationDate" placeholder="" th:value="*{category.creationDate}">
        </div>
        <button type="submit" class="btn btn-primary">Actualizar</button>
        <a class="btn btn-secondary" th:href="@{/categories}">Volver</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
</body>
</html>
